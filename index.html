<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHA RS Lahore Property</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f4f4;
    }
    .hero {
      position: relative;
      height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                  url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 15px;
    }
    .navbar {
      width: 100%;
      max-width: 500px;
      background-color: #005C53;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-radius: 8px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      font-size: 24px;
    }
    .brand-name {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .sub-title {
      font-size: 11px;
      display: block;
      color: #b2dfdb;
    }
    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }
    .hero-content {
      text-align: center;
      color: white;
      width: 100%;
      max-width: 400px;
      margin: auto 0;
    }
    .hero-title {
      font-size: 24px;
      margin-bottom: 25px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .search-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-input {
      padding: 14px 20px;
      border-radius: 30px;
      border: none;
      outline: none;
      font-size: 15px;
      text-align: center;
      width: 100%;
    }
    .search-btn {
      padding: 14px 20px;
      border-radius: 30px;
      border: none;
      background-color: #005C53;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="hero">
    <header class="navbar">
      <div class="logo-container">
        <span class="logo-icon">🏠</span>
        <div>
          <span class="brand-name">DHA RS</span>
          <span class="sub-title">Lahore Property</span>
        </div>
      </div>
      <button class="menu-btn">☰</button>
    </header>

    <div class="hero-content">
      <h1 class="hero-title">لاہور میں اپنے خوابوں کا گھر تلاش کریں</h1>
      
      <div class="search-box">
        <input type="text" class="search-input" placeholder="سوسائٹی، فیز یا ایریا درج کریں...">
        <button class="search-btn">تلاش کریں</button>
      </div>
    </div>
  </div>

</body>
</html>
